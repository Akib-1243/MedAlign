##############################################################################
# MedAlign – Host-level Nginx Reverse Proxy Config
# Deployed to: /etc/nginx/sites-available/medalign.conf  (on the VPS host)
#
# Routes:
#   medalign.austattendance.online/api/*  →  Docker medalign_web  (port 9000)
#   medalign.austattendance.online/*      →  Docker medalign_frontend (port 5173)
#
# SSL: Self-signed cert stored in ~/ssl_certs/ on the VPS.
#      Run 'make ssl' or the CI deploy script to regenerate if expired.
##############################################################################

# ── HTTP: redirect everything to HTTPS ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name medalign.austattendance.online;
    return 301 https://$host$request_uri;
}

# ── HTTPS: main site ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name medalign.austattendance.online;

    # Self-signed SSL certificate (generated by CI deploy script)
    ssl_certificate     /home/s20230204118/ssl_certs/fullchain.pem;
    ssl_certificate_key /home/s20230204118/ssl_certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header X-Content-Type-Options  "nosniff"      always;

    client_max_body_size 20M;

    access_log /var/log/nginx/s20230204118-access.log;
    error_log  /var/log/nginx/s20230204118-error.log;

    # ── Laravel API: all /api/* requests ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── React SPA: everything else ────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
