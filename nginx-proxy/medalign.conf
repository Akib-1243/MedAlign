##############################################################################
# MedAlign – Host-level Nginx Reverse Proxy Config
# Deployed to: /etc/nginx/sites-available/medalign.conf  (on the VPS host)
#
# Routes:
#   medalign.austattendance.online/api/*  →  Docker medalign_web  (port 9000)
#   medalign.austattendance.online/*      →  Docker medalign_frontend (port 5173)
##############################################################################

# ── HTTP: redirect everything to HTTPS ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name medalign.austattendance.online;

    # Let's Encrypt ACME challenge (Certbot needs this for SSL issuance)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: main site ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name medalign.austattendance.online;

    # SSL certificates issued by Certbot / Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/medalign.austattendance.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medalign.austattendance.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header X-Content-Type-Options  "nosniff"      always;

    client_max_body_size 20M;

    # ── Laravel API: all /api/* requests ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── React SPA: everything else ────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
