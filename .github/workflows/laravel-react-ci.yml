name: MedAlign CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: medalign-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Laravel Backend Tests
  # ─────────────────────────────────────────────────────────────────────────────
  laravel-backend:
    name: Laravel Backend Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql, bcmath, ctype, json, openssl, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Copy .env file for Testing
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Validate Composer Configuration
        run: composer validate --no-check-publish

      - name: Generate Laravel Application Key
        run: php artisan key:generate

      - name: Set Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan migrate --force

      - name: Execute PHPUnit Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: vendor/bin/phpunit

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: React Frontend Build
  # ─────────────────────────────────────────────────────────────────────────────
  react-frontend:
    name: React Frontend Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build React Production Assets
        env:
          VITE_API_BASE_URL: https://medalign.austattendance.online/api
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy to VPS  (push to main/master only)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy → medalign.austattendance.online"
    runs-on: ubuntu-24.04
    needs: [ laravel-backend, react-frontend ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e

            echo "==> Pulling latest code..."
            sudo docker run --rm \
              -v ${{ secrets.VPS_PROJECT_PATH }}:${{ secrets.VPS_PROJECT_PATH }} \
              alpine/git \
              -c safe.directory=${{ secrets.VPS_PROJECT_PATH }} \
              -C ${{ secrets.VPS_PROJECT_PATH }} \
              pull origin main

            cd ${{ secrets.VPS_PROJECT_PATH }}

            echo "==> Rebuilding containers with domain API URL..."
            sudo VITE_API_BASE_URL=https://medalign.austattendance.online/api \
              docker compose build \
                --build-arg VITE_API_BASE_URL=https://medalign.austattendance.online/api \
                frontend

            echo "==> Starting all containers..."
            sudo docker compose up -d --remove-orphans

            echo "==> Waiting for DB to be healthy..."
            sleep 30

            echo "==> Running migrations..."
            sudo docker compose exec -T app php artisan migrate --force

            echo "==> Caching Laravel config & routes..."
            sudo docker compose exec -T app php artisan config:clear
            sudo docker compose exec -T app php artisan route:clear
            sudo docker compose exec -T app php artisan view:clear
            sudo docker compose exec -T app php artisan config:cache
            sudo docker compose exec -T app php artisan route:cache

            echo "==> Reloading host Nginx..."
            sudo systemctl reload nginx || true

            echo ""
            echo "==> Live at: https://medalign.austattendance.online"
