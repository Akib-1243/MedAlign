name: MedAlign CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: medalign-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------
  # JOB 1: Laravel Backend & MySQL Tests (runs inside ./backend)
  # ----------------------------------------------------
  laravel-backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql, bcmath, ctype, json, openssl, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Copy .env file for Testing
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Validate Composer Configuration
        run: composer validate --no-check-publish

      - name: Generate Laravel Application Key
        run: php artisan key:generate

      - name: Set Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan migrate --force

      - name: Execute PHPUnit Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: vendor/bin/phpunit

  # ----------------------------------------------------
  # JOB 2: React Frontend Build (runs inside ./frontend)
  # ----------------------------------------------------
  react-frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build React Production Assets
        run: npm run build

  # ----------------------------------------------------
  # JOB 3: Deploy to VPS (only on push to main/master)
  # ----------------------------------------------------
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    needs: [ laravel-backend, react-frontend ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e

            echo "==> Navigating to project directory"
            cd ${{ secrets.VPS_PROJECT_PATH }}

            echo "==> Pulling latest code from GitHub"
            git pull origin ${{ github.ref_name }}

            echo "==> Rebuilding and restarting Docker containers"
            docker compose up --build -d --remove-orphans

            echo "==> Waiting for DB to be healthy..."
            sleep 15

            echo "==> Running Laravel migrations"
            docker compose exec -T app php artisan migrate --force

            echo "==> Clearing and warming up Laravel caches"
            docker compose exec -T app php artisan config:clear
            docker compose exec -T app php artisan route:clear
            docker compose exec -T app php artisan view:clear
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache

            echo "==> Deployment complete!"
