services:
  # ─── Laravel App (PHP-FPM) ───────────────────────────────────────────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: medalign-backend
    container_name: medalign_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - /var/www/vendor # keep vendor inside container
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db # Docker service name — internal network
      DB_PORT: 3306
      DB_DATABASE: medalign_db
      DB_USERNAME: medalign_user
      DB_PASSWORD: medalign_password
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@medalign.app}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-"MedAlign Security"}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - medalign-network

  # ─── Nginx Web Server ────────────────────────────────────────────────────────
  telegram-poller:
    image: medalign-backend
    container_name: medalign_telegram_poller
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan telegram:poll
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: medalign_db
      DB_USERNAME: medalign_user
      DB_PASSWORD: medalign_password
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - telegram
    networks:
      - medalign-network

  web:
    image: nginx:alpine
    container_name: medalign_web
    restart: unless-stopped
    ports:
      - "8000:80" # API available at http://localhost:8000
    volumes:
      - ./backend:/var/www
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - medalign-network

  # ─── React Frontend (Vite development server) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: medalign-frontend
    container_name: medalign_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - web
    networks:
      - medalign-network

  # ─── MySQL Database ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: medalign_db
    restart: unless-stopped
    # ports:
    #   - "3307:3306" # disabled on VPS — MySQL accessible only within Docker network
    environment:
      MYSQL_DATABASE: medalign_db
      MYSQL_ROOT_PASSWORD: medalign_secret
      MYSQL_USER: medalign_user
      MYSQL_PASSWORD: medalign_password
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmedalign_secret" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - medalign-network

  # ─── Mailpit (OTP Email Testing) ─────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit
    container_name: medalign_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI: http://localhost:8025
      - "1025:1025" # SMTP
    networks:
      - medalign-network

  # ─── phpMyAdmin (Web Database GUI) ──────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: medalign_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"               # Web UI: http://localhost:8080
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: medalign_secret
      PMA_ARBITRARY: 1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - medalign-network

networks:
  medalign-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
